plugins {
    id 'com.android.application'
}

android {
    namespace 'ng.tradetrack.app'
    compileSdk 34

    defaultConfig {
        applicationId "ng.tradetrack.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // We ship an unsigned debug-signed release build (no code-signing cert
    // available in this build environment). See android-app/README.md.
    buildFeatures {
        buildConfig true
    }
}
