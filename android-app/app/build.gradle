plugins {
    id 'com.android.application'
}

android {
    namespace 'ng.tradetrack.app'
    compileSdk 34

    defaultConfig {
        applicationId "ng.tradetrack.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // ─────────────────────────────────────────────────────────
        // Production domain — the ONLY hardcoded copy of it in this
        // module. Do NOT assume tradetrack.com is secured yet; keep
        // tradetrack.ng as the fallback until told otherwise.
        //
        // Override at build time without touching any source file:
        //   ./gradlew assembleRelease -PappUrl=https://tradetrack.com
        //
        // MainActivity.java reads this via BuildConfig.APP_URL instead
        // of a literal string constant. The path is "/login" (not the
        // domain root) because "/" now serves the public marketing
        // site — the web app's auth middleware forwards an
        // already-authenticated session on to /dashboard automatically,
        // so returning users see no extra step.
        // ─────────────────────────────────────────────────────────
        buildConfigField "String", "APP_URL",
            "\"${project.findProperty('appUrl') ?: 'https://tradetrack.ng'}/login\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // We ship an unsigned debug-signed release build (no code-signing cert
    // available in this build environment). See android-app/README.md.
    buildFeatures {
        buildConfig true
    }
}
