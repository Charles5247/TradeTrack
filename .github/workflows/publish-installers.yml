name: Publish verified installers
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build installers run on main
        required: true
  workflow_run:
    workflows: ['Build installers']
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
    steps:
      - name: Verify build and publish release assets
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/installers.yml"' run.json
          commit=$(jq -r .head_sha run.json)
          gh run download "$BUILD_RUN_ID" --name android-installer --dir assets
          apk=(assets/TracKasuwa-*.apk)
          test "${#apk[@]}" -eq 1 && test -f "${apk[0]}"
          version=${apk[0]#assets/TracKasuwa-}
          version=${version%.apk}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd assets && sha256sum *.apk > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          Android APK update for TracKasuwa.

          This update repairs Android product camera and gallery selection. Install over the existing app using the same signing identity. Sync queued sales and photos before updating. Do not uninstall: uninstalling removes local data.

          The app opens https://trackasuwa.vercel.app/login. An internet connection is required for the first sign-in.

          A SHA-256 checksum is attached. Never install assets from untrusted sources.
          NOTES
          gh release create "v${version}" --target "$commit" --title "TracKasuwa Android ${version}" --notes-file notes.md "${apk[0]}" assets/SHA256SUMS.txt

